services:
  session-server:
    build:
      context: ../../../src/server
      dockerfile: ../../infra/docker/server.Dockerfile
      args:
        BUILD_MODE: dev
    container_name: jwp-session-server
    ports:
      - "${SESSION_SERVER_PORT:-3000}:3000"
      # Admin panel (web UI). Only listens when ADMIN_PASSWORD is set.
      # Use "127.0.0.1:${ADMIN_PANEL_PORT:-3001}:..." to keep it off the LAN.
      - "${ADMIN_PANEL_PORT:-3001}:${ADMIN_PORT:-3001}"
    restart: unless-stopped
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8096,https://localhost:8096}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-JellyWatchParty}
      - JWT_ISSUER=${JWT_ISSUER:-Jellyfin}
      - RUST_LOG=${RUST_LOG:-info}
      # Admin panel (opt-out). Not started unless ADMIN_PASSWORD is set.
      - ADMIN_ENABLED=${ADMIN_ENABLED:-true}
      - ADMIN_PORT=${ADMIN_PORT:-3001}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SESSION_TTL_SECS=${ADMIN_SESSION_TTL_SECS:-43200}
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-false}
      - ADMIN_TRUST_X_FORWARDED_FOR=${ADMIN_TRUST_X_FORWARDED_FOR:-false}
      - ADMIN_EMPTY_GROUP_TTL_SECS=${ADMIN_EMPTY_GROUP_TTL_SECS:-600}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  jellyfin-dev:
    image: jellyfin/jellyfin:12.0
    container_name: jellyfin-dev
    environment:
      - PUID=${UID:-1000}
      - PGID=${GID:-1000}
    depends_on:
      - session-server
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ./config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_DIR:-${HOME}/Videos/Movies}:/media/Movies:ro
      - ../../../src/clients/jellyfin-web:/jellyfin/jellyfin-web/plugins/jellywatchparty:ro
      - ../../../src/plugins/jellyfin/JellyWatchParty/dist:/config/plugins/JellyWatchParty
      - ./scripts/jellyfin-entrypoint.sh:/jellyfin-entrypoint.sh:ro
    restart: unless-stopped
    entrypoint: /jellyfin-entrypoint.sh

  plugin-builder:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    network_mode: host
    profiles:
      - tools
    volumes:
      - ../../../src/plugins/jellyfin/JellyWatchParty:/src
    environment:
      - HOME=/tmp
      - DOTNET_CLI_HOME=/tmp/.dotnet
    # The plugin project targets net10.0 (Jellyfin 12.x only - Jellyfin
    # 10.11.x support has been dropped).
    command: dotnet publish -c Release -f net10.0 -o /src/dist JellyWatchPartyPlugin.csproj

volumes:
  jellyfin-cache:
