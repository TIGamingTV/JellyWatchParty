# `docker compose pull` uses the published images; `docker compose build`
# builds them from this checkout instead. JWP_TAG picks the channel for both:
# latest (release, default), dev (develop), beta (main) or a version (1.2.3).
services:
  session-server:
    image: ghcr.io/tigamingtv/jwp-session-server:${JWP_TAG:-latest}
    build:
      context: ../../../src/server
      dockerfile: ../../infra/docker/server.Dockerfile
      args:
        BUILD_MODE: release
    container_name: jwp-session-server
    ports:
      - "${SESSION_SERVER_PORT:-3000}:3000"
      # Admin panel (web UI). Only listens when ADMIN_PASSWORD is set.
      # Use "127.0.0.1:${ADMIN_PANEL_PORT:-3001}:..." to keep it off the LAN.
      - "${ADMIN_PANEL_PORT:-3001}:${ADMIN_PORT:-3001}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8096,https://localhost:8096}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-JellyWatchParty}
      - JWT_ISSUER=${JWT_ISSUER:-Jellyfin}
      - RUST_LOG=${RUST_LOG:-info}
      # Admin panel (opt-out). Not started unless ADMIN_PASSWORD is set.
      - ADMIN_ENABLED=${ADMIN_ENABLED:-true}
      - ADMIN_PORT=${ADMIN_PORT:-3001}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SESSION_TTL_SECS=${ADMIN_SESSION_TTL_SECS:-43200}
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-false}
      - ADMIN_TRUST_X_FORWARDED_FOR=${ADMIN_TRUST_X_FORWARDED_FOR:-false}
      - ADMIN_EMPTY_GROUP_TTL_SECS=${ADMIN_EMPTY_GROUP_TTL_SECS:-600}
      # Jellyfin devices in the admin panel (TV apps, Fladder, ...). Needs a
      # URL the session server can reach and an API key from Dashboard > API Keys.
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - JELLYFIN_API_KEY_FILE=${JELLYFIN_API_KEY_FILE:-}
      - BRIDGE_POLL_INTERVAL_MS=${BRIDGE_POLL_INTERVAL_MS:-1000}
      - ADMIN_HOST=${ADMIN_HOST:-0.0.0.0}
      - ADMIN_PASSWORD_FILE=${ADMIN_PASSWORD_FILE:-}
      # Chat integrations (Discord bot). Link codes and settings are kept
      # in DATA_DIR (the jwp-data volume). The integration API listens on
      # INTEGRATION_PORT for the bot container only: never publish it.
      - DATA_DIR=/data
      - INTEGRATION_HOST=0.0.0.0
      - INTEGRATION_PORT=${INTEGRATION_PORT:-3002}
      - DISCORD_INTEGRATION_TOKEN=${DISCORD_INTEGRATION_TOKEN:-}
    volumes:
      - jwp-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Discord bot: start with `docker compose --profile discord up -d`.
  # Needs DISCORD_BOT_TOKEN and DISCORD_INTEGRATION_TOKEN (the same value
  # as on the session server); the rest is set in the admin panel.
  discord-bot:
    image: ghcr.io/tigamingtv/jwp-discord-bot:${JWP_TAG:-latest}
    build:
      context: ../../../src/integrations/discord-bot
      dockerfile: ../../../infra/docker/discord-bot.Dockerfile
      args:
        BUILD_MODE: release
    container_name: jwp-discord-bot
    profiles:
      - discord
    restart: unless-stopped
    depends_on:
      - session-server
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - JWP_INTEGRATION_URL=http://session-server:${INTEGRATION_PORT:-3002}
      - JWP_INTEGRATION_TOKEN=${DISCORD_INTEGRATION_TOKEN:-}
      - RUST_LOG=${RUST_LOG:-info}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  plugin-builder:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    network_mode: host
    profiles:
      - tools
    volumes:
      - ../../../src/plugins/jellyfin/JellyWatchParty:/src
    environment:
      - HOME=/tmp
      - DOTNET_CLI_HOME=/tmp/.dotnet
    # The plugin project targets net10.0 (Jellyfin 12.x only - Jellyfin
    # 10.11.x support has been dropped).
    command: dotnet publish -c Release -f net10.0 -o /src/dist JellyWatchPartyPlugin.csproj

volumes:
  # Chat integration data: settings, link codes, linked accounts.
  jwp-data:
