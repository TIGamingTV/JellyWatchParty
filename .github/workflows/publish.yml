name: Publish

on:
  push:
    branches: [main, develop]
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      server: ${{ steps.filter.outputs.server }}
      bot: ${{ steps.filter.outputs.bot }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # docker-image.yml is listed for both so a change to how images
          # are built (or tagged) republishes them.
          filters: |
            server:
              - 'src/server/**'
              - 'infra/docker/server.Dockerfile'
              - '.github/workflows/docker-image.yml'
            bot:
              - 'src/integrations/discord-bot/**'
              - 'infra/docker/discord-bot.Dockerfile'
              - '.github/workflows/docker-image.yml'
            plugin:
              - 'src/plugins/jellyfin/**'
              - 'src/clients/jellyfin-web/**'

  # Session server image: ghcr.io/tigamingtv/jwp-session-server
  server-image:
    name: Session Server Image
    needs: changes
    if: always() && (github.event_name == 'release' || needs.changes.outputs.server == 'true')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: tigamingtv/jwp-session-server
      context: ./src/server
      dockerfile: ./infra/docker/server.Dockerfile
      artifact-prefix: session-server
      # Empty prefix keeps the cache scope the server used before this
      # workflow was split out (scope = platform).
      cache-prefix: ''
      title: JellyWatchParty Session Server

  # Discord bot image: ghcr.io/tigamingtv/jwp-discord-bot. Same tags as the
  # server (dev / beta / X.Y.Z / X.Y / latest) so both can be pinned to
  # one version. A failed bot build does not block the release assets.
  discord-bot-image:
    name: Discord Bot Image
    needs: changes
    if: always() && (github.event_name == 'release' || needs.changes.outputs.bot == 'true')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: tigamingtv/jwp-discord-bot
      context: ./src/integrations/discord-bot
      dockerfile: ./infra/docker/discord-bot.Dockerfile
      artifact-prefix: discord-bot
      cache-prefix: discord-bot-
      title: JellyWatchParty Discord Bot

  build-plugin:
    name: Build Jellyfin Plugin
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Copy JS files to plugin Web directory
        working-directory: src/plugins/jellyfin
        run: |
          mkdir -p JellyWatchParty/Web
          cp ../../clients/jellyfin-web/plugin.js JellyWatchParty/Web/plugin.js
          for f in state.js utils/time.js utils/video.js utils/misc.js utils/validation.js utils/media.js utils/log.js ui/styles.js ui/indicators.js ui/toasts.js ui/modal.js ui/cards.js ui/bridge.js ui/home.js ui/render.js playback/play.js playback/bind.js playback/sync.js playback/tracks.js chat/messages.js chat/input.js ws/send.js ws/auth.js ws/handlers/room.js ws/handlers/sync.js ws/handlers/playback.js ws/handlers/clock.js ws/connection.js app/lifecycle.js app/cleanup.js; do
            mkdir -p "JellyWatchParty/Web/$(dirname "$f")"
            cp "../../clients/jellyfin-web/$f" "JellyWatchParty/Web/$f"
          done

      - name: Build plugin
        working-directory: src/plugins/jellyfin/JellyWatchParty
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"  # strip optional 'v' prefix to match the manifest version
          # Stamp the release version into the assembly so it matches the
          # plugin repository manifest. If they differ, Jellyfin rewrites the
          # installed meta.json down to the assembly version (1.0.0.0). The
          # dashboard then sends the manifest version to
          # POST /Plugins/{id}/{version}/Disable, which no longer matches any
          # loaded plugin — the enable/disable toggle 404s and the plugin
          # can't be turned off (and it always shows an update as available).
          dotnet publish -c Release -f net10.0 -o dist \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"

      - name: Create plugin zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd src/plugins/jellyfin/JellyWatchParty/dist
          zip -r "../JellyWatchParty-${RELEASE_TAG}.zip" .

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin
          path: src/plugins/jellyfin/JellyWatchParty/JellyWatchParty-${{ github.event.release.tag_name }}.zip

  build-windows-server:
    name: Build Windows Session Server
    runs-on: windows-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/server

      - name: Build release binary
        working-directory: src/server
        run: cargo build --release

      - name: Package Windows build
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG
          $dest = "jwp-session-server-windows-$version"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item src/server/target/release/session-server.exe "$dest/session-server.exe"
          @"
          JellyWatchParty Session Server for Windows
          ===========================================

          No installation required. This is a standalone binary.

          1. (Optional) Set environment variables before launching, e.g. in
             PowerShell:
                 `$env:PORT = "3000"
                 `$env:ALLOWED_ORIGINS = "http://your-jellyfin:8096"
                 `$env:JWT_SECRET = "<32+ char secret, must match the Jellyfin plugin config>"
                 `$env:ADMIN_PASSWORD = "<long random password for the admin panel>"
          2. Run session-server.exe (double-click, or from a terminal).
          3. Allow it through Windows Firewall when prompted so Jellyfin/clients
             can reach it on the configured port (default 3000).
          4. With ADMIN_PASSWORD set, the admin panel is at http://localhost:3001/
             (ADMIN_PORT to change it, ADMIN_ENABLED=false to turn it off).
             Add JELLYFIN_URL and JELLYFIN_API_KEY to put TV apps and other
             Jellyfin clients into rooms from there.

          To run it in the background as a Windows service, use a wrapper such
          as NSSM (https://nssm.cc/) pointed at session-server.exe.

          Full docs: https://tigamingtv.github.io/JellyWatchParty/
          "@ | Out-File -Encoding utf8 "$dest/README.txt"
          Compress-Archive -Path "$dest/*" -DestinationPath "$dest.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-server
          path: jwp-session-server-windows-*.zip
          if-no-files-found: error

  create-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [server-image, build-plugin, build-windows-server]
    if: always() && github.event_name == 'release' && needs.server-image.result == 'success' && needs.build-plugin.result == 'success' && needs.build-windows-server.result == 'success'
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-plugin
          path: artifacts

      - name: Download Windows server artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-server
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-plugin-manifest:
    name: Update Plugin Repository Manifest
    runs-on: ubuntu-latest
    needs: [build-plugin, create-release-assets]
    if: always() && github.event_name == 'release' && needs.build-plugin.result == 'success' && needs.create-release-assets.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-plugin
          path: artifacts

      - name: Update manifest.json
        # Release bodies and tag names are free text — see the note on the
        # develop manifest step. The tag is validated below, but interpolating
        # it directly would break the script before that check ever runs.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          VERSION="${RELEASE_TAG#v}"  # Remove 'v' prefix if present

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Release tag '$VERSION' is not a valid numeric version (expected e.g. 1.0.1). Aborting manifest update."
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CHANGELOG=$(printf '%s' "$RELEASE_BODY" | jq -Rs '.')

          ZIP_NAME="JellyWatchParty-v${VERSION}.zip"
          CHECKSUM=$(md5sum "artifacts/$ZIP_NAME" | awk '{print $1}')

          NEW_VERSION=$(jq --arg version "$VERSION" \
             --arg checksum "$CHECKSUM" \
             --arg timestamp "$TIMESTAMP" \
             --arg abi "12.0.0.0" \
             --arg url "https://github.com/TIGamingTV/JellyWatchParty/releases/download/v${VERSION}/${ZIP_NAME}" \
             --argjson changelog "$CHANGELOG" \
             -n '{
               "version": $version,
               "changelog": $changelog,
               "targetAbi": $abi,
               "sourceUrl": $url,
               "checksum": $checksum,
               "timestamp": $timestamp
             }')

          # Update manifest.json using jq
          jq --argjson newVersion "$NEW_VERSION" \
             '.[0].versions = [$newVersion] + .[0].versions' \
             docs/jellyfin-plugin-repo/manifest.json > manifest.tmp.json

          mv manifest.tmp.json docs/jellyfin-plugin-repo/manifest.json

      - name: Commit and push manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jellyfin-plugin-repo/manifest.json
          git commit -m "Update plugin manifest for $RELEASE_TAG"
          git push

      - name: Trigger Pages rebuild
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/docs.yml/dispatches" \
            -d '{"ref":"main"}'

  build-plugin-dev:
    name: Build Develop Plugin
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.outputs.plugin == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Copy JS files to plugin Web directory
        working-directory: src/plugins/jellyfin
        run: |
          mkdir -p JellyWatchParty/Web
          cp ../../clients/jellyfin-web/plugin.js JellyWatchParty/Web/plugin.js
          for f in state.js utils/time.js utils/video.js utils/misc.js utils/validation.js utils/media.js utils/log.js ui/styles.js ui/indicators.js ui/toasts.js ui/modal.js ui/cards.js ui/bridge.js ui/home.js ui/render.js playback/play.js playback/bind.js playback/sync.js playback/tracks.js chat/messages.js chat/input.js ws/send.js ws/auth.js ws/handlers/room.js ws/handlers/sync.js ws/handlers/playback.js ws/handlers/clock.js ws/connection.js app/lifecycle.js app/cleanup.js; do
            mkdir -p "JellyWatchParty/Web/$(dirname "$f")"
            cp "../../clients/jellyfin-web/$f" "JellyWatchParty/Web/$f"
          done

      - name: Build plugin
        working-directory: src/plugins/jellyfin/JellyWatchParty
        run: |
          VERSION="0.0.${{ github.run_number }}"
          # Keep the assembly version identical to the develop manifest version
          # (see the release build for why a mismatch breaks the disable toggle).
          dotnet publish -c Release -f net10.0 -o dist \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"

      - name: Package develop build
        working-directory: src/plugins/jellyfin/JellyWatchParty
        run: (cd dist && zip -r "../JellyWatchParty-dev.zip" .)

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-dev
          path: src/plugins/jellyfin/JellyWatchParty/JellyWatchParty-dev.zip

  publish-plugin-dev:
    name: Publish Develop Plugin & Manifest
    runs-on: ubuntu-latest
    needs: build-plugin-dev
    if: needs.build-plugin-dev.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: jellyfin-plugin-dev
          path: artifacts

      - name: Publish rolling develop release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: develop-latest
          name: "Develop build #${{ github.run_number }}"
          body: |
            Automated development build from `develop` @ ${{ github.sha }}. Not for production use.

            Install via the dev plugin repository URL (see docs/development/release.md), not via manual sideload of this asset unless you know what you're doing.

            Latest commit: ${{ github.event.head_commit.message }}
          prerelease: true
          make_latest: false
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest-dev.json
        # Commit messages are free text. Interpolating ${{ }} into a run block
        # pastes the value into the script *before* bash parses it, so any
        # quote, parenthesis or backtick in a commit message is a syntax error
        # at best and arbitrary command execution at worst. Pass it through the
        # environment, which the runner sets as data rather than script text.
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="0.0.${{ github.run_number }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CHANGELOG=$(printf '%s' "$HEAD_COMMIT_MESSAGE" | jq -Rs '.')

          ZIP_NAME="JellyWatchParty-dev.zip"
          CHECKSUM=$(md5sum "artifacts/$ZIP_NAME" | awk '{print $1}')

          NEW_VERSION=$(jq --arg version "$VERSION" \
             --arg checksum "$CHECKSUM" \
             --arg timestamp "$TIMESTAMP" \
             --arg abi "12.0.0.0" \
             --arg url "https://github.com/TIGamingTV/JellyWatchParty/releases/download/develop-latest/${ZIP_NAME}" \
             --argjson changelog "$CHANGELOG" \
             -n '{
               "version": $version,
               "changelog": $changelog,
               "targetAbi": $abi,
               "sourceUrl": $url,
               "checksum": $checksum,
               "timestamp": $timestamp
             }')

          jq --argjson newVersion "$NEW_VERSION" \
             '.[0].versions = [$newVersion]' \
             docs/jellyfin-plugin-repo/manifest-dev.json > manifest-dev.tmp.json

          mv manifest-dev.tmp.json docs/jellyfin-plugin-repo/manifest-dev.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/jellyfin-plugin-repo/manifest-dev.json
          git commit -m "Update develop plugin manifest (build ${{ github.run_number }})"
          git push

      - name: Trigger Pages rebuild
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/docs.yml/dispatches" \
            -d '{"ref":"main"}'
