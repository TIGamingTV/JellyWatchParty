name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: src/server
        run: cargo audit

      - name: Run cargo audit (Discord bot)
        if: always()
        working-directory: src/integrations/discord-bot
        run: cargo audit

  trivy-scan:
    name: Trivy Container Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: session-server
            dockerfile: infra/docker/server.Dockerfile
            context: ./src/server
          - name: discord-bot
            dockerfile: infra/docker/discord-bot.Dockerfile
            context: ./src/integrations/discord-bot
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -f ${{ matrix.dockerfile }} -t jwp-${{ matrix.name }}:scan ${{ matrix.context }}

      - name: Run Trivy vulnerability scanner
        # Pinned to a commit: a moving ref like @master runs whatever is pushed
        # there with this job's security-events token.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'jwp-${{ matrix.name }}:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Only report CVEs that have a fixed package to move to, and apply
          # the severity filter to the SARIF too (by default the SARIF output
          # contains every severity and each becomes a code-scanning alert).
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ matrix.name }}

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
